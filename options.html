<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/options.css">
    <link rel="icon" type="image/png" href="./img/2_character_pepe/1_idle/idle/I-1.png">
</head>

<body>

    <div class="option-overlay">

        <div class="site-content">
            <main>
                <h1>Options</h1>
                <div class="option-group">

                    <aside class="option-group-container">
                        <!-- Language Settings -->
                    <fieldset class="option-fieldset">
                        <label for="language-select">Choose Language:</label>

                        <div class="select-container">
                            <input id="langInput" class="select-container-input" type="text" value="" placeholder="Select Language" readonly onclick="showOrHideLanguageList(languageListOpen ? 'hide' : 'show', 'langShowOrHideBtn')">
                            <button id="langShowOrHideBtn" class="select-container-button" type="button" title="show or hide language list">
                                <div title="show or hide icon"></div>
                            </button>
                        </div>

                        <div class="select-list-container" id="langListContainer">
                            <div class="select-list">
                                <button type="button" title="select English language" onclick="">
                                    <span>English</span>
                                </button>
                                <button type="button" title="select Deutsch language" onclick="">
                                    <span>Deutsch</span>
                                </button>
                                <button type="button" title="select Español language" onclick="">
                                    <span>Español</span>    
                                </button>
                            </div>
                        </div>
                    </fieldset>

                    Difficulty Settings
                    <fieldset>
                        <label for="difficulty-select">Choose Difficulty:</label>
                        <select id="difficulty-select" name="difficulties">
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                            <option value="custom">Custom</option>
                        </select>   
                    </fieldset>

                    Audio Settings
                    <fieldset>
                        <label for="volume-control">Volume Control:</label>
                        <input type="range" id="volume-control" name="volume" min="0" max="100">
                        <label for="audio-select">Audio:</label>
                        <select name="audio" id="audio-select">
                            <option value="audio-on">Audio On</option>
                            <option value="audio-off">Audio Off</option>
                        </select>
                    </fieldset>

                    Colortheme Settings
                    <fieldset>
                        <label for="theme-select">Choose Theme:</label>
                        <select id="theme-select" name="themes">
                            <option value="blue">Blue</option>
                            <option value="green">Green</option>
                            <option value="orange">Orange</option>
                        </select>
                    </fieldset>
                    </aside>

                    
                </div>
            </main>

            <footer>
                <div class="footer-content">
                    <button type="button" class="btn btn-yellow">Impressum</button>
                    <button type="button" class="btn btn-yellow">Privacy Policy</button>
                </div>
            </footer>


        </div>


    </div>


    <script src="./js/script.js"></script>
    <script src="./js/options.js"></script>
</body>

</html>
