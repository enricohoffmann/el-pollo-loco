<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options</title>
    <link rel="stylesheet" href="./styles/color.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/options.css">
    <link rel="icon" type="image/png" href="./img/2_character_pepe/1_idle/idle/I-1.png">
</head>

<body>

    <div class="option-overlay">

        <div class="site-content">

            <nav>
                <div class="nav-content">
                    <button type="button" class="btn btn-yellow">Impressum</button>
                    <button type="button" class="btn btn-yellow">Privacy Policy</button>
                </div>
            </nav>

            <main>
                <h1>Options</h1>
                <div class="option-group">

                    <aside class="option-group-container">
                        <!-- Language Settings -->
                        <div class="option-fieldset">
                            <label for="languageInput">Choose Language:</label>

                            <div class="select-container" id="langSelectContainer">
                                <input id="languageInput" class="select-container-input" type="text" value=""
                                    placeholder="Select Language" readonly
                                    onclick="showOrHideLanguageList(languageListOpen ? 'hide' : 'show', 'langShowOrHideBtn')">
                                <button id="langShowOrHideBtn" class="select-container-button btn-show" type="button"
                                    title="show or hide language list" onclick="showOrHideLanguageList(languageListOpen ? 'hide' : 'show', 'langShowOrHideBtn')">
                                    <div title="show or hide icon"></div>
                                </button>
                            </div>

                            <div class="select-list-container" id="langListContainer">
                                <div class="select-list" id="langButtonList">
                                    <button class="btn btn-yellow" type="button" title="select English language" data-selected="false" onclick="selectLanguage('English', this)">
                                        <span>English</span>
                                    </button>
                                    <button class="btn btn-yellow" type="button" title="select Deutsch language" data-selected="false" onclick="selectLanguage('Deutsch', this)">
                                        <span>Deutsch</span>
                                    </button>
                                    <button class="btn btn-yellow" type="button" title="select Español language" data-selected="false" onclick="selectLanguage('Español', this)">
                                        <span>Español</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Audio Settings -->
                        <div class="option-fieldset">
                            <label for="audioInput">Audio:</label>

                            <div class="select-container" id="audioSelectContainer">
                                <input id="audioInput" class="select-container-input" type="text" value=""
                                    placeholder="Select Audio Setting" readonly
                                    onclick="showOrHideAudioList(audioListOpen ? 'hide' : 'show', 'audioShowOrHideBtn')">
                                <button id="audioShowOrHideBtn" class="select-container-button btn-show" type="button"
                                    title="show or hide audio list" onclick="showOrHideAudioList(audioListOpen ? 'hide' : 'show', 'audioShowOrHideBtn')">
                                    <div title="show or hide icon"></div>
                                </button>
                            </div>

                            <div class="select-list-container" id="audioListContainer">
                                <div class="select-list" id="audioButtonList">
                                    <button class="btn btn-yellow" type="button" title="select Audio On" data-selected="false" onclick="selectAudioSetting('Audio On', this)">
                                        <span>Audio On</span>
                                    </button>
                                    <button class="btn btn-yellow" type="button" title="select Audio Off" data-selected="false" onclick="selectAudioSetting('Audio Off', this)">
                                        <span>Audio Off</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Theme Settings -->
                        <div class="option-fieldset">
                            <label for="themeInput">Choose Theme:</label>

                            <div class="select-container" id="themeSelectContainer">
                                <input id="themeInput" class="select-container-input" type="text" value=""
                                    placeholder="Select Theme" readonly
                                    onclick="showOrHideThemeList(themeListOpen ? 'hide' : 'show', 'themeShowHideBtn')">
                                <button id="themeShowHideBtn" class="select-container-button btn-show" type="button"
                                    title="show or hide theme list" onclick="showOrHideThemeList(themeListOpen ? 'hide' : 'show', 'themeShowHideBtn')">
                                    <div title="show or hide icon"></div>
                                </button>
                            </div>

                            <div class="select-list-container" id="themeListContainer">
                                <div class="select-list" id="themeButtonList">
                                    <button class="btn btn-yellow" type="button" title="select Blue theme"  data-selected="false" onclick="selectTheme('Blue', this)">
                                        <span>Blue</span>
                                    </button>
                                    <button class="btn btn-yellow" type="button" title="select Green theme" data-selected="false" onclick="selectTheme('Green', this)">
                                        <span>Green</span>
                                    </button>
                                    <button class="btn btn-yellow" type="button" title="select Orange theme" data-selected="false" onclick="selectTheme('Orange', this)">
                                        <span>Orange</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Difficulty Settings -->
                        <div class="option-fieldset">
                            <label for="difficulty-select">Choose Difficulty:</label>

                            <div class="select-container" id="difficultySelectContainer">
                                <input id="difficultyInput" class="select-container-input" type="text" value=""
                                    placeholder="Select Difficulty" readonly
                                    onclick="showOrHideDifficultyList(difficultyListOpen ? 'hide' : 'show', 'difficultyShowHideBtn')">
                                <button id="difficultyShowHideBtn" class="select-container-button btn-show" type="button"
                                    title="show or hide difficulty list" onclick="showOrHideDifficultyList(difficultyListOpen ? 'hide' : 'show', 'difficultyShowHideBtn')">
                                    <div title="show or hide icon"></div>
                                </button>
                            </div>
                            <div class="select-list-container" id="difficultyListContainer">
                                <div class="select-list" id="difficultyButtonList">
                                    <button class="btn btn-yellow" type="button" title="select Easy difficulty" data-selected="false" onclick="selectDifficulty('Easy', this)">
                                        <span>Easy</span>
                                    </button>
                                    <button class="btn btn-yellow" type="button" title="select Medium difficulty" data-selected="false" onclick="selectDifficulty('Medium', this)">
                                        <span>Medium</span>
                                    </button>
                                    <button class="btn btn-yellow" type="button" title="select Hard difficulty" data-selected="false" onclick="selectDifficulty('Hard', this)">
                                        <span>Hard</span>
                                    </button>
                                    <button class="btn btn-yellow" type="button" title="select Custom difficulty" data-selected="false" onclick="selectDifficulty('Custom', this)">
                                        <span>Custom</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Game Settings -->
                        <div class="game-settings-container">
                            <label for="enemyCountInput">Count of Enemies:</label> 
                            <input type="number" id="enemyCountInput" name="enemyCountInput" min="1" max="20" value="0" readonly>

                            <label class="setting-label" for="coinCountInput">Count of minimum Coins:</label>
                            <input type="number" id="coinCountInput" name="coinCountInput" min="1" max="20" value="0" readonly>

                            <label class="setting-label" for="bottleCountInput">Count of minimum Bottles:</label>
                            <input type="number" id="bottleCountInput" name="bottleCountInput" min="1" max="20" value="0" readonly>
                        </div>
                        

                    </aside> 

                    <div class="option-button-container">
                        <button type="button" class="btn btn-orange btn-lg">Save</button>
                    </div>

                    

                </div>
            </main>

            


        </div>


    </div>


    <script src="./js/script.js"></script>
    <script src="./js/options.js"></script>
</body>

</html>
